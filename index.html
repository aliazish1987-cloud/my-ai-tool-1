<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>Phone Check Pro — Enterprise QC Platform</title>
<style>
:root{
  --bg:#F7F8FB; --bg2:#FFFFFF; --surface:#FFFFFF; --surface2:#F1F4F9;
  --border:#E3E7EF; --border-l:#D7DCE6;
  --text:#0F172A; --dim:#64748B; --faint:#94A3B8;
  --primary:#4F46E5; --primary-d:#4338CA; --primary-l:#6366F1; --accent:#0891B2;
  --success:#16A34A; --danger:#DC2626; --warning:#D97706;
  --grad:linear-gradient(135deg,#4F46E5 0%,#0EA5E9 100%);
  --radius:14px; --shadow:0 1px 3px rgba(15,23,42,.06), 0 8px 24px rgba(15,23,42,.05);
}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Inter,Helvetica,Arial,sans-serif;font-size:14px;line-height:1.5;min-height:100vh;padding-bottom:80px;}
a{color:inherit;text-decoration:none;}
::-webkit-scrollbar{width:8px;height:8px;}
::-webkit-scrollbar-thumb{background:var(--border-l);border-radius:8px;}

.topbar{position:sticky;top:0;z-index:40;background:rgba(255,255,255,.88);backdrop-filter:blur(14px);border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;padding:14px 22px;}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:17px;letter-spacing:-.3px;}
.brand .mark{width:30px;height:30px;border-radius:9px;background:var(--grad);display:flex;align-items:center;justify-content:center;font-size:15px;box-shadow:0 4px 14px rgba(79,70,229,.3);}
.brand .pro{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent;}
.top-right{display:flex;gap:10px;align-items:center;}
.shop-chip{background:#EEF2FF;border:1px solid #C7D2FE;padding:7px 14px;border-radius:999px;font-size:12.5px;font-weight:700;color:var(--primary-d);}
.lock-btn{background:var(--surface2);border:1px solid var(--border-l);color:var(--dim);padding:7px 14px;border-radius:999px;font-size:12.5px;font-weight:600;cursor:pointer;}
.lock-btn:hover{color:var(--text);border-color:var(--primary);}

main{max-width:1000px;margin:0 auto;padding:26px 20px;}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:24px;box-shadow:var(--shadow);margin-bottom:20px;}
.card-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px;flex-wrap:wrap;gap:10px;}
.card-title{font-size:17px;font-weight:700;display:flex;align-items:center;gap:8px;}
.card-sub{color:var(--dim);font-size:12.5px;margin-top:2px;}

.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px;}
@media(max-width:680px){.grid2{grid-template-columns:1fr;}}
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:14px;}
.field label{font-size:12.5px;font-weight:600;color:var(--dim);}
.field input,.field select,.field textarea{background:#FBFCFE;border:1px solid var(--border-l);color:var(--text);padding:11px 13px;border-radius:10px;font-size:14px;font-family:inherit;outline:none;transition:.15s;}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--primary);box-shadow:0 0 0 3px rgba(79,70,229,.12);background:#fff;}
.field input::placeholder{color:var(--faint);}
.err{color:var(--danger);font-size:11.5px;margin-top:3px;display:none;}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:12px 18px;border-radius:11px;font-weight:700;font-size:14px;cursor:pointer;border:none;transition:.15s;}
.btn-primary{background:var(--grad);color:#fff;box-shadow:0 6px 18px rgba(79,70,229,.25);width:100%;}
.btn-primary:hover{filter:brightness(1.07);transform:translateY(-1px);}
.btn-ghost{background:var(--surface2);border:1px solid var(--border-l);color:var(--text);}
.btn-ghost:hover{border-color:var(--primary);color:var(--primary-d);}
.btn-outline{background:#fff;border:1px solid var(--primary);color:var(--primary-d);padding:8px 14px;font-size:12.5px;}
.btn-sm{padding:7px 12px;font-size:12px;}
.btn-danger{background:var(--danger);color:#fff;}
.btn-block{width:100%;}

.stat-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:22px;}
@media(max-width:680px){.stat-grid{grid-template-columns:repeat(2,1fr);}}
.stat{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:18px;}
.stat .n{font-size:26px;font-weight:800;}
.stat .l{font-size:11.5px;color:var(--dim);margin-top:4px;text-transform:uppercase;letter-spacing:.4px;}
.stat.g-a .n{color:var(--success);}
.stat.g-x .n{color:var(--danger);}
.stat.g-p .n{color:var(--accent);}

.bottomnav{position:fixed;bottom:0;left:0;right:0;background:rgba(255,255,255,.94);backdrop-filter:blur(14px);border-top:1px solid var(--border);display:flex;z-index:50;}
.navbtn{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:10px 0 12px;color:var(--faint);cursor:pointer;font-size:11px;font-weight:600;}
.navbtn.active{color:var(--primary-d);}
.navbtn .ic{font-size:18px;}

.cat-block{margin-bottom:18px;}
.cat-header{display:flex;align-items:center;justify-content:space-between;background:var(--surface2);border:1px solid var(--border-l);border-radius:12px 12px 0 0;padding:13px 18px;cursor:pointer;}
.cat-title{font-weight:700;font-size:14.5px;display:flex;align-items:center;gap:9px;}
.cat-progress{font-size:11.5px;color:var(--dim);font-weight:600;}
.cat-body{border:1px solid var(--border-l);border-top:none;border-radius:0 0 12px 12px;background:var(--surface);}
.item-row{padding:16px 18px;border-bottom:1px solid var(--border);}
.item-row:last-child{border-bottom:none;}
.item-top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap;}
.item-label{font-weight:650;font-size:13.5px;}
.item-desc{color:var(--dim);font-size:12px;margin-top:4px;line-height:1.5;}
.tag{display:inline-block;font-size:10px;font-weight:700;padding:2px 7px;border-radius:5px;margin-left:7px;letter-spacing:.3px;vertical-align:middle;}
.tag-crit{background:#FEF2F2;color:#B91C1C;border:1px solid #FCA5A5;}
.tag-red{background:#FFFBEB;color:#B45309;border:1px solid #FCD34D;}
.seg{display:flex;gap:6px;flex-shrink:0;}
.seg-btn{padding:7px 13px;border-radius:8px;font-size:11.5px;font-weight:700;background:#F8FAFC;border:1px solid var(--border-l);color:var(--dim);cursor:pointer;}
.seg-btn.pass.on{background:#DCFCE7;border-color:var(--success);color:#15803D;}
.seg-btn.fail.on{background:#FEE2E2;border-color:var(--danger);color:#B91C1C;}
.seg-btn.na.on{background:#F1F5F9;border-color:var(--faint);color:var(--dim);}
.item-extra{display:flex;gap:10px;margin-top:10px;flex-wrap:wrap;align-items:center;}
.item-extra textarea{flex:1;min-width:180px;background:#FBFCFE;border:1px solid var(--border-l);border-radius:8px;color:var(--text);padding:8px 10px;font-size:12px;font-family:inherit;resize:vertical;min-height:34px;}
.tool-btn{background:#EEF2FF;border:1px solid #C7D2FE;color:var(--primary-d);padding:7px 12px;border-radius:8px;font-size:11.5px;font-weight:700;cursor:pointer;white-space:nowrap;}
.photo-label{background:var(--surface2);border:1px solid var(--border-l);padding:7px 12px;border-radius:8px;font-size:11.5px;font-weight:600;cursor:pointer;color:var(--dim);}
.photo-thumb{width:34px;height:34px;object-fit:cover;border-radius:6px;border:1px solid var(--border-l);}

.sticky-bar{position:sticky;top:64px;z-index:30;background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:14px 18px;display:flex;justify-content:space-between;align-items:center;margin-bottom:18px;flex-wrap:wrap;gap:12px;box-shadow:var(--shadow);}
.sb-stats{display:flex;gap:18px;flex-wrap:wrap;}
.sb-stat{font-size:12px;color:var(--dim);}
.sb-stat b{color:var(--text);font-size:14px;}

.modal-overlay{position:fixed;inset:0;background:rgba(15,23,42,.55);backdrop-filter:blur(4px);z-index:100;display:flex;align-items:center;justify-content:center;padding:16px;}
.modal-box{background:#fff;border:1px solid var(--border);border-radius:16px;padding:22px;max-width:480px;width:100%;box-shadow:0 20px 60px rgba(15,23,42,.25);}
.modal-box h3{margin-bottom:6px;font-size:16px;}
.modal-box p{color:var(--dim);font-size:12.5px;margin-bottom:16px;}
.pixel-flash{position:fixed;inset:0;z-index:200;cursor:pointer;}
.grid-canvas-wrap{background:#000;border-radius:10px;overflow:hidden;margin-bottom:14px;}
.stopwatch-num{font-size:40px;font-weight:800;text-align:center;font-variant-numeric:tabular-nums;color:var(--primary-d);margin:14px 0;}

.hero-score{text-align:center;padding:30px 20px;border-radius:16px;margin-bottom:20px;background:var(--surface2);border:1px solid var(--border-l);}
.hero-pct{font-size:52px;font-weight:900;line-height:1;color:var(--text);}
.grade-badge{display:inline-block;padding:6px 20px;border-radius:999px;font-weight:800;font-size:15px;margin-top:12px;}
.grade-A{background:#DCFCE7;color:#15803D;border:1px solid #86EFAC;}
.grade-B{background:#E0F2FE;color:#0369A1;border:1px solid #7DD3FC;}
.grade-C{background:#FEF3C7;color:#B45309;border:1px solid #FCD34D;}
.grade-D{background:#FFEDD5;color:#C2410C;border:1px solid #FDBA74;}
.grade-F,.grade-X{background:#FEE2E2;color:#B91C1C;border:1px solid #FCA5A5;}
.risk-banner{padding:16px 18px;border-radius:12px;margin-bottom:20px;font-weight:700;font-size:13.5px;display:flex;align-items:center;gap:10px;}
.risk-critical{background:#FEF2F2;border:1px solid var(--danger);color:#B91C1C;}
.risk-high{background:#FFF7ED;border:1px solid #F97316;color:#C2410C;}
.risk-medium{background:#FFFBEB;border:1px solid var(--warning);color:#B45309;}
.risk-low{background:#F0FDF4;border:1px solid var(--success);color:#15803D;}
.fail-item{background:#FEF2F2;border-left:3px solid var(--danger);border-radius:8px;padding:12px 14px;margin-bottom:8px;}
.fail-item .ft{font-weight:700;font-size:13px;color:var(--text);}
.fail-item .fd{color:var(--dim);font-size:12px;margin-top:3px;}
.det-cat{font-weight:700;font-size:13.5px;margin:18px 0 8px;color:var(--primary-d);border-bottom:1px solid var(--border);padding-bottom:6px;}
.det-row{display:flex;justify-content:space-between;padding:7px 0;font-size:12.5px;border-bottom:1px solid var(--border);}
.det-pass{color:var(--success);font-weight:700;}
.det-fail{color:var(--danger);font-weight:700;}
.det-na{color:var(--faint);font-weight:700;}

.hist-row{display:flex;justify-content:space-between;align-items:center;padding:13px 16px;border:1px solid var(--border);border-radius:10px;margin-bottom:8px;background:#FBFCFE;cursor:pointer;}
.hist-row:hover{border-color:var(--primary);}
.hist-left b{font-size:13.5px;}
.hist-left div{color:var(--dim);font-size:11.5px;margin-top:2px;}

#pinOverlay{position:fixed;inset:0;background:var(--bg);z-index:999;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:16px;}
#pinOverlay input{width:200px;text-align:center;font-size:22px;letter-spacing:8px;padding:12px;border-radius:10px;background:#fff;border:1px solid var(--border-l);color:var(--text);}

@media print{
  .topbar,.bottomnav,.sticky-bar,.no-print,.tool-btn,.photo-label,.seg,.btn{display:none !important;}
  body{background:#fff;color:#000;padding:0;}
  .card{box-shadow:none;border:1px solid #ccc;background:#fff;color:#000;}
  main{max-width:100%;padding:10px;}
}
</style>
</head>
<body>

<div id="pinOverlay" style="display:none;">
  <div class="brand"><span class="mark">📱</span> Phone Check <span class="pro">PRO</span></div>
  <div style="color:var(--dim);font-size:13px;">Enter PIN to unlock</div>
  <input type="password" id="pinInput" maxlength="6" inputmode="numeric">
  <div id="pinErr" style="color:var(--danger);font-size:12px;display:none;">Incorrect PIN</div>
  <button class="btn btn-primary" style="width:200px;" onclick="PCP.unlock()">Unlock</button>
</div>

<div class="topbar">
  <div class="brand"><span class="mark">📱</span> Phone Check <span class="pro">PRO</span></div>
  <div class="top-right">
    <span class="shop-chip" id="shopChip">Set Up Shop Profile</span>
    <button class="lock-btn" onclick="PCP.lock()">🔒 Lock</button>
  </div>
</div>

<main id="app"></main>

<div class="bottomnav">
  <div class="navbtn" data-v="dashboard" onclick="PCP.go('dashboard')"><span class="ic">📊</span>Dashboard</div>
  <div class="navbtn" data-v="deviceid" onclick="PCP.go('deviceid')"><span class="ic">🔍</span>New QC Check</div>
  <div class="navbtn" data-v="shop" onclick="PCP.go('shop')"><span class="ic">🏪</span>Shop Profile</div>
</div>

<div id="modalRoot"></div>

<script>
(function(){
"use strict";

const CHECKLIST = [
{id:'sec',title:'Critical Security & Account Locks',icon:'🔐',items:[
 {id:'SEC_IMEI',label:'IMEI Blacklist Status',desc:'Verify IMEI is not reported lost, stolen, or blacklisted via carrier/GSMA database.',critical:true,red:true},
 {id:'SEC_FRP',label:'Google FRP Lock (Factory Reset Protection)',desc:'Confirm Android FRP lock is cleared with no residual Google account lock.',critical:true,red:true},
 {id:'SEC_ICLOUD',label:'iCloud / Find My iPhone Lock',desc:'Confirm Apple ID fully signed out, Find My disabled, no Activation Lock.',critical:true,red:true},
 {id:'SEC_MDM',label:'MDM / Enterprise Supervision Lock',desc:'Check device is not enrolled in a corporate Mobile Device Management profile.',critical:true,red:true},
 {id:'SEC_ROOT',label:'Root / Jailbreak Detection',desc:'Inspect for unauthorized root or jailbreak modification of the OS.',critical:false,red:true}
]},
{id:'for',title:'Tamper & Repair Forensics (Opened / Non-Genuine Parts)',icon:'🔎',items:[
 {id:'FOR_SCREWS',label:'Screw Head Tamper Marks',desc:'Inspect internal screw heads for stripping/rotation marks indicating prior disassembly.',critical:false,red:true},
 {id:'FOR_SEAMS',label:'Chassis Seam & Glue Seal Integrity',desc:'Check chassis seams and factory adhesive for gaps indicating the device was opened before.',critical:false,red:true},
 {id:'FOR_SCREEN',label:'Screen Assembly Originality & Adhesive',desc:'Check screen adhesive freshness and bezel gap consistency for prior screen replacement.',critical:false,red:true},
 {id:'FOR_BATTERY',label:'Battery Pull-Tab / Adhesive Seal',desc:'Check battery adhesive/pull-tab condition for signs of prior battery replacement.',critical:false,red:true},
 {id:'FOR_GENUINE',label:'Genuine vs. Aftermarket Parts Cross-Check',desc:'Cross-check screen, battery & camera module serials against diagnostics to detect non-OEM / unofficial "market fitted" parts.',critical:false,red:true},
 {id:'FOR_LCI',label:'Liquid Contact Indicator (Water Damage)',desc:'Check LCI stickers in SIM tray / charging port for a triggered (red/pink) water damage indicator.',critical:true,red:true}
]},
{id:'dsp',title:'Display & Touch Panel',icon:'📱',items:[
 {id:'DSP_POWER',label:'Display Power-On & Backlight Uniformity',desc:'Confirm screen powers on with even backlight, no shadowing or discoloration.',critical:false,red:false},
 {id:'DSP_PIXELS',label:'Dead / Stuck Pixel Test',desc:'Run full-screen color cycle to detect dead, stuck, or discolored pixels.',critical:false,red:false,tool:'pixel'},
 {id:'DSP_GRID',label:'Touch Digitizer Grid Response',desc:'Run the multi-zone touch grid to confirm full digitizer responsiveness with no dead zones.',critical:false,red:false,tool:'grid'},
 {id:'DSP_BURNIN',label:'OLED Burn-In / Ghosting Check',desc:'Check for permanent image retention or burn-in on a full grey/white screen.',critical:false,red:true},
 {id:'DSP_GLASS',label:'Glass Surface Cracks / Scratches',desc:'Inspect front glass for cracks, chips, or deep scratches affecting visibility.',critical:false,red:false}
]},
{id:'aud',title:'Audio System (Speaker, Receiver, Microphones)',icon:'🔊',items:[
 {id:'AUD_EARPIECE',label:'Earpiece / Call Receiver + Distortion Test',desc:'Play tone through earpiece at max volume; confirm clear audio with no crackle, rattle or distortion.',critical:false,red:false,tool:'tone'},
 {id:'AUD_LOUD',label:'Loudspeaker + Distortion Test',desc:'Play 1kHz tone through main loudspeaker at full volume; confirm no rattling, muffling or distortion.',critical:false,red:false,tool:'tone'},
 {id:'AUD_MIC_PRI',label:'Primary Microphone & Voice Clarity',desc:'Record a voice memo; confirm clear pickup with no muffling, clipping, or distortion.',critical:false,red:false},
 {id:'AUD_MIC_SEC',label:'Secondary / Noise-Cancelling Microphone',desc:'Test secondary mic (top/back) used for call noise cancellation.',critical:false,red:false}
]},
{id:'cam',title:'Camera System',icon:'📷',items:[
 {id:'CAM_REAR',label:'Rear Primary Camera — Focus & Clarity',desc:'Capture a test photo; confirm correct autofocus, clarity, and color accuracy.',critical:false,red:false},
 {id:'CAM_OIS',label:'Optical Image Stabilization (OIS)',desc:'Check stabilization function and absence of unusual rattle from the OIS module.',critical:false,red:false},
 {id:'CAM_SEC',label:'Secondary Lenses (Ultra-Wide / Telephoto / Macro)',desc:'Test all secondary rear lenses for focus, clarity, and switching function.',critical:false,red:false},
 {id:'CAM_FRONT',label:'Front / Selfie Camera',desc:'Capture a test photo via front camera; confirm clarity and correct exposure.',critical:false,red:false},
 {id:'CAM_FLASH',label:'LED Flash / Flashlight Function',desc:'Confirm camera flash fires correctly and flashlight toggle works.',critical:false,red:false}
]},
{id:'sns',title:'Sensors & Biometrics',icon:'🧿',items:[
 {id:'SNS_PROX',label:'Proximity Sensor',desc:'Confirm screen blanks during calls when held near ear and relights when moved away.',critical:false,red:false},
 {id:'SNS_FINGER',label:'Fingerprint Sensor Enrollment & Unlock',desc:'Enroll a test fingerprint and confirm consistent, fast unlock recognition.',critical:false,red:false},
 {id:'SNS_FACE',label:'Face Recognition / Depth Sensor',desc:'Enroll and test facial unlock; a failed/disabled array may indicate prior repair damage.',critical:false,red:true},
 {id:'SNS_ACCEL',label:'Accelerometer / Gyroscope',desc:'Confirm screen auto-rotation and motion-based functions respond correctly.',critical:false,red:false}
]},
{id:'net',title:'Connectivity & Signal',icon:'📶',items:[
 {id:'NET_CELL',label:'Cellular Network / Signal Strength',desc:'Insert active SIM; confirm stable signal bars and successful call/data connection.',critical:false,red:true},
 {id:'NET_SIM',label:'SIM Card Tray & Reader',desc:'Test SIM tray ejector mechanism and confirm reliable SIM card detection.',critical:false,red:false},
 {id:'NET_SD',label:'MicroSD / Memory Card Slot',desc:'If supported, test card insertion, detection, and read/write. Mark N/A if device has no card slot.',critical:false,red:false,naAllowed:true},
 {id:'NET_WIFI',label:'Wi-Fi Connectivity & Signal Strength',desc:'Connect to 2.4GHz & 5GHz networks; confirm stable connection and strong signal at distance.',critical:false,red:false},
 {id:'NET_BT',label:'Bluetooth Pairing & Audio Streaming',desc:'Pair with a Bluetooth accessory and confirm stable streaming without dropouts.',critical:false,red:false},
 {id:'NET_GPS',label:'GPS Location Lock',desc:'Confirm device acquires accurate GPS location lock outdoors within reasonable time.',critical:false,red:false},
 {id:'NET_NFC',label:'NFC Read / Write',desc:'Test NFC tap function (payment or tag read) to confirm the chip is operational.',critical:false,red:false}
]},
{id:'btn',title:'Buttons & Physical Controls',icon:'🔘',items:[
 {id:'BTN_PWR',label:'Power / Sleep Button',desc:'Confirm power button responds consistently with no sticking or double-press issue.',critical:false,red:false},
 {id:'BTN_VOL',label:'Volume Up / Down Buttons',desc:'Confirm both volume buttons register presses reliably.',critical:false,red:false},
 {id:'BTN_MUTE',label:'Side Keys / Mute-Silent Switch',desc:'Confirm mute switch / action button toggles correctly and feels mechanically sound.',critical:false,red:false}
]},
{id:'bat',title:'Battery & Charging',icon:'🔋',items:[
 {id:'BAT_HEALTH',label:'Battery Health (≥80% Required)',desc:'Check battery health % in diagnostics; below 80% must be disclosed to the buyer.',critical:false,red:true},
 {id:'BAT_PORT',label:'Charging Port — Physical & Connection',desc:'Inspect port for debris/corrosion/bent pins; confirm secure cable connection.',critical:false,red:false},
 {id:'BAT_FAST',label:'Fast Charging Function',desc:'Confirm device accepts rated fast-charging wattage with a compatible charger.',critical:false,red:false},
 {id:'BAT_DATA',label:'USB Data Transfer Function',desc:'Confirm cable/port also passes data when connected to a computer.',critical:false,red:false},
 {id:'BAT_WIRELESS',label:'Wireless Charging (If Supported)',desc:'Confirm wireless coil engages correctly on a Qi charging pad.',critical:false,red:false,naAllowed:true}
]},
{id:'prf',title:'Performance & Thermal Stability',icon:'🌡️',items:[
 {id:'PRF_HEAT',label:'Overheating / Thermal Stress Test',desc:'Run camera 4K recording or a graphics-heavy app for 10 minutes; device should not become uncomfortably hot or throttle excessively.',critical:false,red:true,tool:'stopwatch'},
 {id:'PRF_LAG',label:'System Lag / Freeze / Hang Test',desc:'Rapidly multitask across 5+ apps and scroll heavy content; confirm no freezing, force-closes, or unresponsive hangs.',critical:false,red:true,tool:'stopwatch'},
 {id:'PRF_BENCH',label:'General Responsiveness & App Launch Speed',desc:'Confirm apps open and animations run smoothly without stutter versus expected device spec.',critical:false,red:false}
]},
{id:'vib',title:'Haptics & Vibration',icon:'📳',items:[
 {id:'VIB_MOTOR',label:'Vibration Motor / Haptic Engine',desc:'Trigger vibration test; confirm strong, consistent haptic feedback with no rattling buzz.',critical:false,red:false,tool:'vibrate'}
]},
{id:'chs',title:'Chassis & Cosmetic Condition',icon:'🧱',items:[
 {id:'CHS_BEND',label:'Frame Bend / Structural Warping',desc:'Check chassis frame for bending, warping, or twisting under light pressure.',critical:false,red:true},
 {id:'CHS_REAR',label:'Rear Panel / Back Glass Condition',desc:'Inspect rear panel for cracks, discoloration, or adhesive lifting.',critical:false,red:false},
 {id:'CHS_LENS',label:'Camera Lens Glass Condition',desc:'Inspect camera lens covers for cracks or deep scratches affecting image quality.',critical:false,red:false}
]},
{id:'fin',title:'Ownership & Financial Verification',icon:'💳',items:[
 {id:'FIN_LEASE',label:'Active Installment / EMI Finance Lock',desc:'Verify via carrier/retailer records the device is not under an active, unpaid installment or lease plan.',critical:true,red:true},
 {id:'FIN_CARRIER',label:'Carrier-Lock Status',desc:'Confirm whether device is carrier-locked vs factory unlocked, matching buyer expectation.',critical:false,red:true}
]},
{id:'new',title:'Sealed / New Device Authenticity',icon:'📦',items:[
 {id:'NEW_IMEI_MATCH',label:'IMEI Triple-Match (Box / Tray / Device)',desc:'Confirm IMEI printed on retail box, SIM tray, and in-device settings all match exactly.',critical:true,red:true},
 {id:'NEW_CYCLES',label:'Battery Cycle Count / Activation Date Consistency',desc:'For devices claimed "sealed/new", confirm battery cycle count and activation date are consistent with an unused device.',critical:false,red:true}
]}
];
const ALL_ITEMS = CHECKLIST.flatMap(c=>c.items.map(i=>({...i,cat:c.id,catTitle:c.title})));

const CFG_KEY='pcp_gh_cfg', HIST_KEY='pcp_gh_hist', DRAFT_KEY='pcp_gh_draft';
let S={cfg:null, hist:[], draft:null, view:'dashboard'};

function loadAll(){
  try{S.cfg=JSON.parse(localStorage.getItem(CFG_KEY))||null;}catch(e){S.cfg=null;}
  try{S.hist=JSON.parse(localStorage.getItem(HIST_KEY))||[];}catch(e){S.hist=[];}
  try{S.draft=JSON.parse(localStorage.getItem(DRAFT_KEY))||null;}catch(e){S.draft=null;}
}
function saveCfg(){localStorage.setItem(CFG_KEY,JSON.stringify(S.cfg));}
function saveHist(){localStorage.setItem(HIST_KEY,JSON.stringify(S.hist));}
function saveDraft(){localStorage.setItem(DRAFT_KEY,JSON.stringify(S.draft));}
function clearDraft(){S.draft=null;localStorage.removeItem(DRAFT_KEY);}
function newDraft(){ return {id:'RPT-'+Date.now(), createdAt:new Date().toISOString(), device:{}, results:{}, finalized:false}; }

function esc(s){return (s||'').toString().replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}
function luhnIMEI(imei){
  const d=(imei||'').replace(/\D/g,'');
  if(d.length!==15) return false;
  let sum=0;
  for(let i=0;i<15;i++){ let n=parseInt(d[i],10); if((i%2)===1){ n*=2; if(n>9) n-=9; } sum+=n; }
  return sum%10===0;
}
function storageAnomaly(stated,detected){
  if(!stated||!detected) return null;
  const ratio=detected/stated;
  if(ratio<0.70) return {level:'severe',msg:'⚠ Severe mismatch — possible counterfeit/fake storage chip.'};
  if(ratio>1.05) return {level:'impossible',msg:'⚠ Detected capacity exceeds stated — data inconsistency.'};
  if(ratio<0.85) return {level:'mild',msg:'Note: some capacity loss is normal (OS/system reserved space).'};
  return {level:'normal',msg:'Storage capacity within normal range.'};
}
function grade(pct,criticalFail){
  if(criticalFail) return 'X';
  if(pct>=95) return 'A'; if(pct>=85) return 'B'; if(pct>=70) return 'C'; if(pct>=50) return 'D'; return 'F';
}
const GRADE_LABEL={A:'Excellent — Like New',B:'Very Good — Minor Issues',C:'Good — Notable Issues',D:'Fair — Needs Disclosure',F:'Poor — Significant Faults',X:'CRITICAL FAIL — Override'};

function computeSummary(draft){
  let pass=0,fail=0,na=0,total=0, criticalFails=[], redFlags=[];
  ALL_ITEMS.forEach(it=>{
    const r=draft.results[it.id];
    if(!r || !r.status) return;
    total++;
    if(r.status==='pass') pass++;
    else if(r.status==='na') na++;
    else if(r.status==='fail'){ fail++; if(it.critical) criticalFails.push(it); if(it.red) redFlags.push(it); }
  });
  const scored=pass+fail;
  const pct=scored>0?Math.round((pass/scored)*100):0;
  const critical=criticalFails.length>0;
  const g=grade(pct,critical);
  let risk='low';
  if(critical) risk='critical'; else if(redFlags.length>=2) risk='high'; else if(redFlags.length===1) risk='medium';
  return {pass,fail,na,total,pct,grade:g,criticalFails,redFlags,risk};
}

}

        <label class="btn btn-outline" style="cursor:pointer;">⬆ Import<input type="file" accept="application/json" style="display:none" onchange="PCP.importJSON(this)"></label>
      </div>
    </div>
    <input class="field-search" placeholder="Search by IMEI, model, or report ID..." oninput="PCP.filterHist(this.value)" style="width:100%;background:#FBFCFE;border:1px solid var(--border-l);color:var(--text);padding:11px 13px;border-radius:10px;margin-bottom:14px;">

PCP.liveImeiCheck=function(v){

PCP.liveStorageCheck=function(){
  const stated=parseInt(document.getElementById('dStated').value,10);
  const detected=parseFloat(document.getElementById('dDetected').value);
  const note=document.getElementById('storageNote'); const a=storageAnomaly(stated,detected);
  if(!a){note.textContent='';return;}
  note.textContent=a.msg;
  note.style.color = a.level==='severe'||a.level==='impossible' ? 'var(--danger)' : (a.level==='mild'?'var(--warning)':'var(--success)');

PCP.setResult=function(id,status){
  if(!S.draft.results[id]) S.draft.results[id]={};
  S.draft.results[id].status = (S.draft.results[id].status===status)? null : status;
  saveDraft(); render();
};
PCP.saveNote=function(id,val){ if(!S.draft.results[id]) S.draft.results[id]={}; S.draft.results[id].note=val; saveDraft(); };
PCP.attachPhoto=function(id,input){
  const file=input.files[0]; if(!file) return;
  const img=new Image(); const reader=new FileReader();
  reader.onload=e=>{
    img.onload=()=>{
      const maxW=640; const scale=Math.min(1,maxW/img.width);
      const canvas=document.createElement('canvas'); canvas.width=img.width*scale; canvas.height=img.height*scale;
      const ctx=canvas.getContext('2d'); ctx.drawImage(img,0,0,canvas.width,canvas.height);
      const dataUrl=canvas.toDataURL('image/jpeg',0.6);
      if(!S.draft.results[id]) S.draft.results[id]={};
      S.draft.results[id].photo=dataUrl; saveDraft(); render();
    };
    img.src=e.target.result;
  };
  reader.readAsDataURL(file);
};
PCP.bulkPass=function(){
  if(!confirm('Mark ALL remaining untested items as PASS? Already-set items are kept.')) return;
  ALL_ITEMS.forEach(it=>{ if(!S.draft.results[it.id] || !S.draft.results[it.id].status){ S.draft.results[it.id]={...(S.draft.results[it.id]||{}),status:'pass'}; } });
  saveDraft(); render();
};

PCP.finalize=function(){
  const sum=computeSummary(S.draft);
  if(sum.total < ALL_ITEMS.length){ if(!confirm(`${ALL_ITEMS.length - sum.total} item(s) are untested. Finalize anyway (untested items are excluded from scoring)?`)) return; }
  S.draft.summary=sum; S.draft.finalized=true; S.draft.finalizedAt=new Date().toISOString();
  const existingIdx=S.hist.findIndex(h=>h.id===S.draft.id);
  if(existingIdx>=0) S.hist[existingIdx]=JSON.parse(JSON.stringify(S.draft)); else S.hist.push(JSON.parse(JSON.stringify(S.draft)));
  saveHist(); clearDraft(); S.view='report'; render();
};

    <b style="color:var(--text);">Disclaimer:</b> ${esc(c.disclaimer||'This inspection reflects device condition at time of testing only.')}
    <br><br>Customer Signature: ______________________ &nbsp;&nbsp;&nbsp; Technician Signature: ______________________
    <br>Generated by Phone Check Pro on ${new Date().toLocaleString()}
  </div>`;
}

PCP.openTool=function(type,itemId){
  const root=document.getElementById('modalRoot');
  if(type==='pixel'){
    const colors=['#ff0000','#00ff00','#0000ff','#ffffff','#000000','#808080'];
    root.innerHTML=`<div class="pixel-flash" style="background:${colors[0]}" id="pxFlash"></div>`;
    PCP._pxIdx=0; PCP._pxColors=colors;
    let lastTap=0;
    document.getElementById('pxFlash').addEventListener('click',()=>{
      const now=Date.now();
      if(now-lastTap<350){ document.getElementById('modalRoot').innerHTML=''; } else { PCP.pxNext(); }
      lastTap=now;
    });
  } else if(type==='grid'){
    root.innerHTML=`<div class="modal-overlay"><div class="modal-box" style="max-width:420px;">
      <h3>🖐 Touch Digitizer Grid Test</h3><p>Touch every cell — it should turn green. Any cell that won't register indicates a dead touch zone.</p>
      <div class="grid-canvas-wrap"><canvas id="touchGrid" width="360" height="270" style="width:100%;touch-action:none;"></canvas></div>
      <button class="btn btn-primary" onclick="document.getElementById('modalRoot').innerHTML=''">Close</button>
    </div></div>`;
    setupTouchGrid();
  } else if(type==='tone'){
    root.innerHTML=`<div class="modal-overlay"><div class="modal-box">
      <h3>🔊 Audio Output Test</h3><p>Playing a 1kHz test tone for 1.5 seconds at rising volume. Listen for distortion, rattle, or crackle.</p>
      <button class="btn btn-primary" onclick="PCP.playTone()">▶ Play Test Tone</button><div style="height:10px;"></div>
      <button class="btn btn-ghost btn-block" onclick="document.getElementById('modalRoot').innerHTML=''">Close</button>
    </div></div>`;
  } else if(type==='vibrate'){
    root.innerHTML=`<div class="modal-overlay"><div class="modal-box">
      <h3>📳 Haptic / Vibration Test</h3><p>Triggers a vibration pattern. Confirm it feels strong and consistent with no buzzing rattle.</p>
      <button class="btn btn-primary" onclick="PCP.runVibrate()">▶ Trigger Vibration</button><div style="height:10px;"></div>
      <button class="btn btn-ghost btn-block" onclick="document.getElementById('modalRoot').innerHTML=''">Close</button>
    </div></div>`;
  } else if(type==='stopwatch'){
    root.innerHTML=`<div class="modal-overlay"><div class="modal-box">
      <h3>⏱ Stress Test Timer</h3><p>Run the stated stress scenario (thermal or multitask) and watch the clock. Mark PASS/FAIL on the checklist once complete.</p>
      <div class="stopwatch-num" id="swNum">00:00</div>
      <div style="display:flex;gap:8px;">
        <button class="btn btn-primary" style="flex:1" onclick="PCP.swStart()">▶ Start</button>
        <button class="btn btn-ghost" style="flex:1" onclick="PCP.swStop()">⏸ Stop/Reset</button>
      </div><div style="height:10px;"></div>
      <button class="btn btn-ghost btn-block" onclick="PCP.swStop();document.getElementById('modalRoot').innerHTML=''">Close</button>
    </div></div>`;
  }
};
function setupTouchGrid(){
  const canvas=document.getElementById('touchGrid'); const ctx=canvas.getContext('2d');
  const cols=8, rows=6; const cw=canvas.width/cols, ch=canvas.height/rows; const touched=new Set();
  function draw(){
    ctx.fillStyle='#000'; ctx.fillRect(0,0,canvas.width,canvas.height);
    for(let r=0;r<rows;r++) for(let c=0;c<cols;c++){ ctx.fillStyle = touched.has(r+'-'+c) ? '#10B981' : '#2A3344'; ctx.fillRect(c*cw+1,r*ch+1,cw-2,ch-2); }
  }
  function mark(x,y){
    const rect=canvas.getBoundingClientRect(); const scaleX=canvas.width/rect.width, scaleY=canvas.height/rect.height;
    const cx=Math.floor((x-rect.left)*scaleX/cw), cy=Math.floor((y-rect.top)*scaleY/ch);
    if(cx>=0&&cx<cols&&cy>=0&&cy<rows){ touched.add(cy+'-'+cx); draw(); }
  }
  canvas.addEventListener('pointerdown',e=>mark(e.clientX,e.clientY));
  canvas.addEventListener('pointermove',e=>{ if(e.pressure>0||e.buttons>0) mark(e.clientX,e.clientY); });
  draw();
}
PCP.pxNext=function(){ PCP._pxIdx=(PCP._pxIdx+1)%PCP._pxColors.length; const el=document.getElementById('pxFlash'); if(el) el.style.background=PCP._pxColors[PCP._pxIdx]; };
PCP.playTone=function(){
  try{
    const ctxA=new (window.AudioContext||window.webkitAudioContext)();
    const osc=ctxA.createOscillator(); const gain=ctxA.createGain();
    osc.frequency.value=1000; osc.type='sine';
    gain.gain.setValueAtTime(0.0001,ctxA.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.3,ctxA.currentTime+0.05);
    gain.gain.exponentialRampToValueAtTime(0.0001,ctxA.currentTime+1.5);
    osc.connect(gain); gain.connect(ctxA.destination); osc.start(); osc.stop(ctxA.currentTime+1.5);
  }catch(e){ alert('Audio playback not supported on this browser.'); }
};
PCP.runVibrate=function(){ if(navigator.vibrate){ navigator.vibrate([150,80,150]); } else alert('Vibration API not supported on this device/browser.'); };
PCP._swInterval=null; PCP._swSeconds=0;
PCP.swStart=function(){
  if(PCP._swInterval) return;
  PCP._swInterval=setInterval(()=>{
    PCP._swSeconds++;
    const m=String(Math.floor(PCP._swSeconds/60)).padStart(2,'0'); const s=String(PCP._swSeconds%60).padStart(2,'0');
    const el=document.getElementById('swNum'); if(el) el.textContent=m+':'+s;
  },1000);
};
PCP.swStop=function(){ clearInterval(PCP._swInterval); PCP._swInterval=null; PCP._swSeconds=0; const el=document.getElementById('swNum'); if(el) el.textContent='00:00'; };

PCP.exportJSON=function(){
  const blob=new Blob([JSON.stringify(S.hist,null,2)],{type:'application/json'});
  const url=URL.createObjectURL(blob); const a=document.createElement('a'); a.href=url; a.download='phonecheckpro_history.json'; a.click(); URL.revokeObjectURL(url);
};
PCP.importJSON=function(input){
  const file=input.files[0]; if(!file) return; const reader=new FileReader();
  reader.onload=e=>{
    try{
      const data=JSON.parse(e.target.result); if(!Array.isArray(data)) throw new Error('Invalid format');
      data.forEach(d=>{ if(!d.id||!d.device||!d.summary) throw new Error('Invalid schema'); });
      S.hist=S.hist.concat(data); saveHist(); render(); alert(`✅ Imported ${data.length} report(s).`);
    }catch(err){ alert('❌ Import failed: file is not a valid Phone Check Pro export.'); }
  };
  reader.readAsText(file);
};

PCP.go=function(view){
  if(view==='deviceid' && (!S.draft || S.draft.finalized)) S.draft=newDraft();
  S.view=view; render();
};
PCP.lock=function(){ document.getElementById('pinOverlay').style.display='flex'; document.getElementById('pinInput').value=''; document.getElementById('pinErr').style.display='none'; };
PCP.unlock=function(){
  const pin=document.getElementById('pinInput').value; const correct = S.cfg && S.cfg.pin ? S.cfg.pin : '1234';
  if(pin===correct){ document.getElementById('pinOverlay').style.display='none'; } else{ document.getElementById('pinErr').style.display='block'; }
};

loadAll();
if(S.draft && S.draft.finalized) S.draft=null;
if(!S.draft) S.draft=newDraft();
S.view = S.cfg ? 'dashboard' : 'shop';
render();

})();
</script>
