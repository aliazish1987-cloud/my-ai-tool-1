*{box-sizing:border-box}

label{display:block;font-size:12px;font-weight:600;color:var(--sub);margin:10px 0 4px}

}

.toolbtn{margin-top:8px;font-size:12px;padding:6px 10px;border-radius:7px;background:var(--card2);border:1px solid var(--border);cursor:pointer}

<script>
/* ============== CHECKLIST DATA ============== */
const CATEGORIES = [

const ALL_ITEMS = [

 {id:'DSP_GLASS',cat:'DSP',label:'Front Glass Crack/Scratch',desc:'Visual inspection of front glass condition.'},

 {id:'AUD_EARPIECE',cat:'AUD',label:'Earpiece Speaker & Voice Clarity',desc:'Play tone close to ear, check for distortion.',tool:'tone'},
 {id:'AUD_LOUD',cat:'AUD',label:'Loudspeaker Output & Distortion',desc:'Max volume tone, check rattling/distortion.',tool:'tone'},
 {id:'AUD_MIC_PRI',cat:'AUD',label:'Primary Microphone',desc:'Record/voice call clarity test.'},
 {id:'AUD_MIC_SEC',cat:'AUD',label:'Secondary/Noise-Cancelling Mic',desc:'Secondary mic function test.'},

 {id:'CAM_REAR',cat:'CAM',label:'Rear Main Camera Focus & Clarity',desc:'Check autofocus, clarity, spots.'},
 {id:'CAM_OIS',cat:'CAM',label:'Optical Image Stabilization',desc:'Check OIS functions during movement.'},

 {id:'FIN_LEASE',cat:'FIN',label:'Installment/EMI/Lease Finance Status',desc:'Confirm device is fully paid off, not under active finance.',critical:true,red:true},

 {id:'NEW_IMEI_MATCH',cat:'NEW',label:'Box IMEI vs Device IMEI Match',desc:'IMEI on box/sticker must match device IMEI.',critical:true,red:true},
 {id:'NEW_CYCLES',cat:'NEW',label:'Battery Cycle Count',desc:'Verify cycle count matches "new/sealed" claim.',red:true}
];

/* ============== UTILITIES ============== */
function luhnIMEI(raw){
  const s = (raw||'').replace(/\D/g,'');
  if(s.length!==15) return false;
  let sum=0;
  for(let i=0;i<15;i++){
    let d = parseInt(s[i]);
    if(i%2===1){ d*=2; if(d>9) d-=9; }
    sum+=d;
  }
  return sum%10===0;
}
function storageAnomaly(statedGB, detectedGB){
  if(!statedGB||!detectedGB) return {level:'unknown',msg:'Insufficient data'};
  const ratio = detectedGB/statedGB;
  if(ratio<0.70) return {level:'severe',msg:'Severe shortfall — counterfeit storage suspected',ratio};
  if(ratio<0.85) return {level:'mild',msg:'Mild shortfall — normal OS/partition overhead',ratio};
  if(ratio<=1.05) return {level:'normal',msg:'Storage matches stated capacity',ratio};
  return {level:'impossible',msg:'Detected exceeds stated — data inconsistency',ratio};
}
function gradeFromPercent(p){
  if(p>=95) return 'A'; if(p>=85) return 'B'; if(p>=70) return 'C'; if(p>=50) return 'D'; return 'F';
}
function computeSummary(draft){
  let total=0,passed=0,failed=0,na=0,criticalFail=false,redFlags=0;
  const failedList=[];
  ALL_ITEMS.forEach(it=>{
    const r = draft.results[it.id];
    if(!r || !r.result) return;
    total++;
    if(r.result==='pass') passed++;
    else if(r.result==='na') na++;
    else if(r.result==='fail'){
      failed++;
      if(it.critical) criticalFail=true;
      if(it.red) redFlags++;
      failedList.push({id:it.id,label:it.label,cat:it.cat,critical:!!it.critical,auto:!!r.auto,note:r.note||''});
    }
  });
  const applicable = total - na;
  const pct = applicable>0 ? Math.round((passed/applicable)*1000)/10 : 0;
  let g = gradeFromPercent(pct);
  if(criticalFail) g='X';
  let risk='Low';
  if(criticalFail) risk='Critical';
  else if(redFlags>=2) risk='High';
  else if(redFlags===1) risk='Medium';
  return {total,passed,failed,na,pct,grade:g,criticalFail,redFlags,risk,failedList};
}

/* ============== ADB / WEBUSB MODULE ============== */
const Adb = (function(){
  function T(s){ return (s.charCodeAt(0) | s.charCodeAt(1)<<8 | s.charCodeAt(2)<<16 | s.charCodeAt(3)<<24) >>> 0; }
  const CMD = { CNXN:T('CNXN'), AUTH:T('AUTH'), OPEN:T('OPEN'), OKAY:T('OKAY'), CLSE:T('CLSE'), WRTE:T('WRTE') };
  const AUTH_TOKEN=1, AUTH_SIGNATURE=2, AUTH_RSAPUBLICKEY=3, VERSION=0x01000000, MAXDATA=1048576;

  function checksum(data){ let s=0; for(let i=0;i<data.length;i++) s=(s+data[i])>>>0; return s>>>0; }
  function buildMsg(cmd,arg0,arg1,data){
    data = data || new Uint8Array(0);
    const h = new Uint8Array(24); const dv = new DataView(h.buffer);
    dv.setUint32(0,cmd,true); dv.setUint32(4,arg0,true); dv.setUint32(8,arg1,true);
    dv.setUint32(12,data.length,true); dv.setUint32(16,checksum(data),true);
    dv.setUint32(20,(cmd^0xFFFFFFFF)>>>0,true);
    return {header:h,data};
  }
  function parseHeader(h){
    const dv = new DataView(h.buffer,h.byteOffset,h.byteLength);
    return {cmd:dv.getUint32(0,true),arg0:dv.getUint32(4,true),arg1:dv.getUint32(8,true),len:dv.getUint32(12,true)};
  }
  function b64urlToBytes(s){
    s=s.replace(/-/g,'+').replace(/_/g,'/'); while(s.length%4) s+='=';
    const bin=atob(s); const out=new Uint8Array(bin.length);
    for(let i=0;i<bin.length;i++) out[i]=bin.charCodeAt(i);
    return out;
  }
  function bytesToBig(bytes){ let r=0n; for(const b of bytes) r=(r<<8n)|BigInt(b); return r; }
  function bigToBytes(n,len){ const out=new Uint8Array(len); for(let i=len-1;i>=0;i--){ out[i]=Number(n&0xFFn); n>>=8n; } return out; }
  function modPow(base,exp,mod){
    let result=1n; base%=mod;
    while(exp>0n){ if(exp&1n) result=(result*base)%mod; exp>>=1n; base=(base*base)%mod; }
    return result;
  }
  async function getOrCreateKey(){
    const saved = localStorage.getItem('pcp_adb_key');
    if(saved){ try{ return JSON.parse(saved); }catch(e){} }
    const pair = await crypto.subtle.generateKey(
      {name:'RSASSA-PKCS1-v1_5',modulusLength:2048,publicExponent:new Uint8Array([1,0,1]),hash:'SHA-1'},
      true,['sign','verify']
    );
    const jwk = await crypto.subtle.exportKey('jwk', pair.privateKey);
    const key = {n:jwk.n,e:jwk.e,d:jwk.d};
    localStorage.setItem('pcp_adb_key', JSON.stringify(key));
    return key;
  }
  function signToken(key, token){
    const n = bytesToBig(b64urlToBytes(key.n));
    const d = bytesToBig(b64urlToBytes(key.d));
    const klen=256, ps=klen-3-token.length;
    const em = new Uint8Array(klen);
    em[0]=0;em[1]=1; for(let i=0;i<ps;i++) em[2+i]=0xFF; em[2+ps]=0; em.set(token,3+ps);
    return bigToBytes(modPow(bytesToBig(em),d,n), klen);
  }
  function modInverse32(n0){
    const MASK=(1n<<32n)-1n; let inv=BigInt.asUintN(32,n0);
    for(let i=0;i<4;i++) inv=(inv*((2n-(BigInt.asUintN(32,n0)*inv & MASK)) & MASK)) & MASK;
    return BigInt.asUintN(32,(0n-inv));
  }
  function encodePublicKey(key){
    const n = bytesToBig(b64urlToBytes(key.n));
    const e = bytesToBig(b64urlToBytes(key.e));
    const words=64, n0=n & 0xFFFFFFFFn, n0inv=modInverse32(n0);
    const R = 1n<<BigInt(32*words), rr=(R*R)%n;
    const out = new Uint8Array(4+4+256+256+4); const dv = new DataView(out.buffer);
    dv.setUint32(0,words,true); dv.setUint32(4,Number(n0inv),true);
    out.set(bigToBytes(n,256).reverse(),8);
    out.set(bigToBytes(rr,256).reverse(),8+256);
    dv.setUint32(8+512,Number(e),true);
    let bin=''; for(const b of out) bin+=String.fromCharCode(b);
    return btoa(bin)+' pcp@webadb\u0000';
  }

  class Connection{
    constructor(){ this.device=null; this.epIn=null; this.epOut=null; this.localId=0; this.onLog=()=>{}; }
    log(m){ this.onLog(m); }
    async requestDevice(){
      this.device = await navigator.usb.requestDevice({filters:[{classCode:0xFF,subclassCode:0x42,protocolCode:0x01}]});
    }
    async open(){
      const d=this.device; await d.open();
      if(!d.configuration) await d.selectConfiguration(1);
      let found=null;
      for(const cfg of d.configurations) for(const itf of cfg.interfaces) for(const alt of itf.alternates)
        if(alt.interfaceClass===0xFF && alt.interfaceSubclass===0x42 && alt.interfaceProtocol===0x01)
          found={interfaceNumber:itf.interfaceNumber,alt};
      if(!found) throw new Error('NO_ADB_INTERFACE');
      await d.claimInterface(found.interfaceNumber);
      for(const ep of found.alt.endpoints){
        if(ep.direction==='in') this.epIn=ep.endpointNumber;
        if(ep.direction==='out') this.epOut=ep.endpointNumber;
      }
      if(!this.epIn||!this.epOut) throw new Error('NO_ENDPOINTS');
    }
    async writeMsg(cmd,arg0,arg1,data){
      const {header,data:d} = buildMsg(cmd,arg0,arg1,data);
      await this.device.transferOut(this.epOut,header);
      if(d.length>0) await this.device.transferOut(this.epOut,d);
    }
    async readMsg(timeoutMs){
      timeoutMs = timeoutMs||10000;
      const res = await Promise.race([
        this.device.transferIn(this.epIn,24),
        new Promise((_,rej)=>setTimeout(()=>rej(new Error('TIMEOUT')),timeoutMs))
      ]);
      const h = new Uint8Array(res.data.buffer,res.data.byteOffset,res.data.byteLength);
      const parsed = parseHeader(h);
      let data = new Uint8Array(0);
      if(parsed.len>0){
        const res2 = await Promise.race([
          this.device.transferIn(this.epIn,parsed.len),
          new Promise((_,rej)=>setTimeout(()=>rej(new Error('TIMEOUT')),timeoutMs))
        ]);
        data = new Uint8Array(res2.data.buffer,res2.data.byteOffset,res2.data.byteLength);
      }
      return {...parsed,data};
    }
    async handshake(){
      const key = await getOrCreateKey();
      this.log('Sending CNXN...');
      await this.writeMsg(CMD.CNXN,VERSION,MAXDATA,new TextEncoder().encode('host::pcp\u0000'));
      let tries=0;
      while(tries<4){
        const msg = await this.readMsg(15000);
        if(msg.cmd===CMD.CNXN){ this.log('Connected: '+new TextDecoder().decode(msg.data)); return true; }
        if(msg.cmd===CMD.AUTH && msg.arg0===AUTH_TOKEN){
          tries++;
          if(tries===1){
            this.log('Signing auth token...');
            await this.writeMsg(CMD.AUTH,AUTH_SIGNATURE,0,signToken(key,msg.data));
          } else {
            this.log('⚠ Check your phone screen — tap "Allow USB debugging"');
            await this.writeMsg(CMD.AUTH,AUTH_RSAPUBLICKEY,0,new TextEncoder().encode(encodePublicKey(key)));
          }
          continue;
        }
        throw new Error('UNEXPECTED_RESPONSE');
      }
      throw new Error('AUTH_TIMEOUT');
    }
    async shell(cmd,timeoutMs){
      timeoutMs = timeoutMs||8000;
      const id = ++this.localId;
      await this.writeMsg(CMD.OPEN,id,0,new TextEncoder().encode('shell:'+cmd+'\u0000'));
      let remoteId=0, chunks=[], deadline=Date.now()+timeoutMs;
      while(Date.now()<deadline){
        const msg = await this.readMsg(timeoutMs);
        if(msg.cmd===CMD.OKAY){ remoteId=msg.arg0; continue; }
        if(msg.cmd===CMD.WRTE){ chunks.push(msg.data); await this.writeMsg(CMD.OKAY,id,msg.arg0); continue; }
        if(msg.cmd===CMD.CLSE){ await this.writeMsg(CMD.CLSE,id,msg.arg0||remoteId); break; }
      }
      const total = chunks.reduce((a,c)=>a+c.length,0);
      const buf = new Uint8Array(total); let off=0;
      for(const c of chunks){ buf.set(c,off); off+=c.length; }
      return new TextDecoder().decode(buf);
    }
    async close(){ try{ await this.device.close(); }catch(e){} }
  }
  return {Connection};
})();

async function runAdbDiagnostics(conn, logFn){
  const cmds = {
    model:'getprop ro.product.model', manufacturer:'getprop ro.product.manufacturer',
    androidVer:'getprop ro.build.version.release', secPatch:'getprop ro.build.version.security_patch',
    serial:'getprop ro.serialno', battery:'dumpsys battery', storage:'df /data',
    features:'pm list features', sim:'getprop gsm.sim.state', screen:'wm size'
  };
  const out={};
  for(const k in cmds){
    logFn('Running: '+cmds[k]);
    try{ out[k]=await conn.shell(cmds[k]); }catch(e){ out[k]=''; logFn('⚠ failed: '+k); }
  }
  return out;
}
function parseAdbResults(raw){
  const battery={};
  (raw.battery||'').split('\n').forEach(line=>{
    const m=line.match(/^\s*(\w[\w ]*?):\s*(.+)$/); if(m) battery[m[1].trim()]=m[2].trim();
  });
  const healthMap={1:'Unknown',2:'Good',3:'Overheat',4:'Dead',5:'Over voltage',6:'Unspecified failure',7:'Cold'};
  const healthCode = parseInt(battery['health']);
  const tempC = battery['temperature'] ? (parseInt(battery['temperature'])/10).toFixed(1) : null;
  let storageGB=null;
  const sline = (raw.storage||'').split('\n').find(l=>l.includes('/data'));
  if(sline){ const p=sline.trim().split(/\s+/); if(p[1]) storageGB=(parseInt(p[1])/1024/1024).toFixed(1); }
  const features = raw.features||'';
  return {
    model:(raw.model||'').trim(), manufacturer:(raw.manufacturer||'').trim(),
    androidVer:(raw.androidVer||'').trim(), secPatch:(raw.secPatch||'').trim(),
    serial:(raw.serial||'').trim(), batteryLevel:battery['level']||null,
    batteryHealth:healthMap[healthCode]||'Unknown', batteryTempC:tempC, storageGB,
    hasNFC:/feature:android\.hardware\.nfc/.test(features),
    hasFinger:/feature:android\.hardware\.fingerprint/.test(features),
    hasBT:/feature:android\.hardware\.bluetooth/.test(features),
    simState:(raw.sim||'').trim(), screen:(raw.screen||'').trim()
  };
}

  /* ---------- USB MODE ---------- */

    return `<div class="modal-ov" id="usbModalRoot"><div class="modal">

    </div></div>`;
  },
  usbLogAdd(m){ this.state.usbLog.push(m); const el=document.getElementById('usbLog'); if(el){ el.textContent=this.state.usbLog.join('\n'); el.scrollTop=el.scrollHeight; } },
  async usbConnect(){
    const conn = new Adb.Connection();
    conn.onLog = (m)=>this.usbLogAdd(m);
    try{
      this.usbLogAdd('Opening device picker...');
      await conn.requestDevice();
      this.usbLogAdd('Opening USB interface...');
      await conn.open();
      this.usbLogAdd('Starting handshake...');
      await conn.handshake();
      this.usbLogAdd('✅ Connected successfully.');
      this.state.usbConn = conn;
      this.usbLogAdd('Running diagnostics...');
      const raw = await runAdbDiagnostics(conn, (m)=>this.usbLogAdd(m));
      const parsed = parseAdbResults(raw);
      this.usbApplyResults(parsed);
      this.usbLogAdd('✅ Diagnostics complete. Auto-filled items marked in checklist.');
      this.usbLogAdd('Model: '+parsed.model+' | Android '+parsed.androidVer+' | Battery '+parsed.batteryLevel+'% ('+parsed.batteryHealth+')');
      setTimeout(()=>{ this.closeUsbModal(); this.proceedChecklistFromUsb(); }, 1200);
    }catch(e){
      if(e.name==='NotFoundError'){ this.usbLogAdd('Cancelled — no device selected.'); return; }
      if(e.message==='NO_ADB_INTERFACE'){
        this.usbLogAdd('⚠ No ADB interface found.');
        this.usbLogAdd('→ On phone: Settings → About Phone → tap "Build Number" 7 times.');
        this.usbLogAdd('→ Settings → Developer Options → enable "USB debugging".');
        this.usbLogAdd('→ Reconnect cable and click Connect again.');
        return;
      }
      if(e.message==='AUTH_TIMEOUT'){
        this.usbLogAdd('⚠ Timed out waiting for authorization. Check phone screen for the "Allow USB debugging?" popup and tap Allow, then retry.');
        return;
      }
      this.usbLogAdd('⚠ Connection failed: '+e.message);
      this.usbLogAdd('You can continue in Guided Manual Mode instead — tap Close below.');
    }
  },
  usbApplyResults(parsed){
    const draft = this.state.draft;
    draft.adbData = parsed;
    const set = (id,result,note)=>{ draft.results[id] = {...(draft.results[id]||{}), result, note, auto:true}; };
    if(parsed.batteryHealth && parsed.batteryHealth!=='Unknown'){
      set('BAT_HEALTH', parsed.batteryHealth==='Good' ? 'pass':'fail',
        `ADB: health=${parsed.batteryHealth}, level=${parsed.batteryLevel}%, temp=${parsed.batteryTempC}°C`);
    }
    if(parsed.simState){
      set('NET_SIM', /ready|loaded/i.test(parsed.simState) ? 'pass':'fail', `ADB: sim_state=${parsed.simState}`);
    }
    set('NET_NFC', parsed.hasNFC?'pass':'na', `ADB: NFC hardware ${parsed.hasNFC?'present':'not detected'}`);
    set('SNS_FINGER', parsed.hasFinger?'pass':'na', `ADB: fingerprint hardware ${parsed.hasFinger?'present':'not detected'}`);
    set('NET_BT', parsed.hasBT?'pass':'na', `ADB: bluetooth hardware ${parsed.hasBT?'present':'not detected'}`);
    if(parsed.storageGB){
      const stated = parseFloat(draft.device.storage)||0;
      if(stated>0){
        const anomaly = storageAnomaly(stated, parseFloat(parsed.storageGB));
        draft.storageCheck = {detected:parsed.storageGB, stated, ...anomaly};
      }
    }
    if(parsed.model && !draft.device.model) draft.device.model = parsed.model;
    this.saveDraft();
  },

  /* ---------- TOOLS ---------- */
  openTool(tool,itemId){
    if(tool==='pixel') this.toolPixel();
    else if(tool==='grid') this.toolGrid();
    else if(tool==='tone') this.toolTone();
    else if(tool==='vibrate') navigator.vibrate ? navigator.vibrate([150,80,150]) : alert('Vibration not supported on this device.');
    else if(tool==='stopwatch') this.toolStopwatch();
  },
  toolPixel(){
    const colors=['#ff0000','#00ff00','#0000ff','#ffffff','#000000','#808080'];
    let i=0;
    const ov=document.createElement('div');
    ov.className='pixelover'; ov.style.background=colors[0];
    ov.innerHTML='Tap to cycle color • Double-tap to close';
    ov.onclick=()=>{ i=(i+1)%colors.length; ov.style.background=colors[i]; };
    ov.ondblclick=(e)=>{ e.stopPropagation(); document.body.removeChild(ov); };
    document.body.appendChild(ov);
  },
  toolGrid(){
    const ov=document.createElement('div'); ov.className='pixelover'; ov.style.background='#111';
    ov.innerHTML='<canvas id="gridCanvas" style="width:95vw;height:70vh;background:#222"></canvas><div style="position:absolute;bottom:20px">Double-tap to close</div>';
    ov.ondblclick=()=>document.body.removeChild(ov);
    document.body.appendChild(ov);
    const canvas=document.getElementById('gridCanvas');
    canvas.width=canvas.clientWidth; canvas.height=canvas.clientHeight;
    const ctx=canvas.getContext('2d'); const cols=8, rows=6;
    const cw=canvas.width/cols, ch=canvas.height/rows;
    for(let x=0;x<cols;x++)for(let y=0;y<rows;y++){ ctx.strokeStyle='#555'; ctx.strokeRect(x*cw,y*ch,cw,ch); }
    canvas.addEventListener('pointermove',e=>{
      const r=canvas.getBoundingClientRect();
      const x=Math.floor((e.clientX-r.left)/cw), y=Math.floor((e.clientY-r.top)/ch);
      ctx.fillStyle='rgba(0,255,0,.5)'; ctx.fillRect(x*cw,y*ch,cw,ch);
    });
  },
  toolTone(){
    try{
      const ctx = new (window.AudioContext||window.webkitAudioContext)();
      const osc = ctx.createOscillator(); const gain = ctx.createGain();
      osc.frequency.value=1000; osc.connect(gain); gain.connect(ctx.destination);
      gain.gain.setValueAtTime(0.3, ctx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime+1.5);
      osc.start(); osc.stop(ctx.currentTime+1.5);
    }catch(e){ alert('Audio test not supported.'); }
  },
  toolStopwatch(){
    const ov=document.createElement('div'); ov.className='pixelover'; ov.style.background='rgba(15,23,42,.9)';
    ov.innerHTML=`<div style="text-align:center"><div id="swTime" style="font-size:40px;font-weight:800">00:00</div>
      <button class="btn btn-primary" id="swBtn" style="margin-top:10px">Start</button>
      <button class="btn btn-ghost" style="margin-top:10px;margin-left:8px" onclick="this.closest('.pixelover').remove()">Close</button></div>`;
    document.body.appendChild(ov);
    let t=0, running=false, iv=null;
    document.getElementById('swBtn').onclick=(e)=>{
      running=!running; e.target.textContent = running?'Stop':'Start';
      if(running){ iv=setInterval(()=>{ t++; const m=String(Math.floor(t/60)).padStart(2,'0'); const s=String(t%60).padStart(2,'0'); document.getElementById('swTime').textContent=m+':'+s; },1000); }
      else clearInterval(iv);
    };
  },

    const cfg = this.state.cfg || {name:'My Shop',address:'',phone:'',disclaimer:''};

      </div>
      <div class="sub" style="margin-top:10px">${d.device.brand||''} ${d.device.model||''} • IMEI ${d.device.imei||'—'} • ${new Date(d.finalizedAt||d.createdAt).toLocaleString()}</div>
    </div>

    <div class="card"><div class="h2">⚠️ Failed Hardware / Non-Cleared Tests Summary</div>
      <div class="grid2" style="margin-bottom:10px">
        <div class="stat"><b>${s.total}</b>Total</div><div class="stat"><b>${s.passed}</b>Passed</div>
        <div class="stat"><b>${s.failed}</b>Failed</div><div class="stat"><b>${s.na}</b>N/A</div>
      </div>
      ${s.failedList.length===0?'<div class="sub">No failed items. Device passed all tested checks.</div>':
        s.failedList.map(f=>`<div class="item"><div class="item-label">${f.label} ${f.critical?'<span class="tag tag-crit">CRITICAL</span>':''}${f.auto?'<span class="tag tag-auto">ADB</span>':''}</div>
        <div class="item-desc">Category: ${f.cat}${f.note?' • '+f.note:''}</div></div>`).join('')}
    </div>

    ${d.adbData ? `<div class="card"><div class="h2">🔌 ADB Diagnostic Evidence</div>
      <div class="item-desc">Model: ${d.adbData.model} • Manufacturer: ${d.adbData.manufacturer}<br>
      Android: ${d.adbData.androidVer} • Security patch: ${d.adbData.secPatch}<br>
      Serial: ${d.adbData.serial}<br>
      Battery: ${d.adbData.batteryLevel}% (${d.adbData.batteryHealth}) • Temp: ${d.adbData.batteryTempC}°C<br>
      Storage detected: ${d.adbData.storageGB} GB ${d.storageCheck?('('+d.storageCheck.msg+')'):''}<br>
      Screen: ${d.adbData.screen}</div>
    </div>`:''}

    <div class="card"><div class="h2">📋 Full Checklist Detail</div>
      ${CATEGORIES.map(cat=>{
        const items = ALL_ITEMS.filter(i=>i.cat===cat.key);
        return `<div class="cat-head">${cat.icon} ${cat.title}</div>` + items.map(it=>{
          const r=d.results[it.id]||{result:'—'};
          const color = r.result==='pass'?'var(--green)':r.result==='fail'?'var(--red)':'var(--sub)';
          return `<div class="item-desc" style="margin-bottom:4px"><b style="color:${color}">[${(r.result||'—').toUpperCase()}]</b> ${it.label}${r.note?' — '+r.note:''}</div>`;
        }).join('');
      }).join('')}
    </div>

    ${d.photos&&d.photos.length?`<div class="card"><div class="h2">📷 Evidence Photos</div><div class="row">${d.photos.map(p=>`<img class="thumb" src="${p}">`).join('')}</div></div>`:''}

    <div class="card"><div class="item-desc"><i>${cfg.disclaimer||''}</i></div></div>

    <div class="card">
      <button class="btn btn-primary btn-block" onclick="window.print()">🖨️ Print / Save as PDF</button>
      <button class="btn btn-ghost btn-block" style="margin-top:8px" onclick="PCP.go('dashboard')">← Back to Dashboard</button>
    </div>`;
  }
};
PCP.init();
</script>
</body>
</html>
